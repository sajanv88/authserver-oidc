# Releases a tag vX.Y.Z without rebuilding: retags the image main.yaml built for that commit,
# publishes the Helm chart to GHCR as OCI, and creates the GitHub Release.
#
# Ritual: merge to main → wait for main.yaml to go green → git tag vX.Y.Z && git push origin vX.Y.Z
# (a merge that changed only what isn't in the image starts no main.yaml run: tag it as it is).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: auth-server
  IMAGE: ghcr.io/sajanv88/auth-server
  CHART_REPOSITORY: oci://ghcr.io/sajanv88/charts
  HELM_VERSION: v4.3.1

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is vX.Y.Z and on main
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} isn't vMAJOR.MINOR.PATCH."
            exit 1
          fi
          # fetch-depth: 0 already brought origin/main; no second fetch (the checkout keeps no
          # credentials, so one would fail on a private repo).
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which isn't on main. Tag a commit that has been merged to main."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the image for this commit
        id: source
        run: |
          # What main.yaml's paths-ignore leaves out of the image; keep the two alike.
          in_image() {
            case "$1" in
              apps/landing/* | apps/example-client/* | apps/tests/* | *.md |                 .github/workflows/pages.yaml | .github/workflows/e2e.yaml) return 1 ;;
              *) return 0 ;;
            esac
          }
          # This commit's image, or else the nearest one before it on main, if nothing that goes
          # into the image has changed since (main.yaml skipped the commits in between).
          for commit in $(git rev-list --first-parent --max-count=50 "${GITHUB_SHA}"); do
            if ! docker buildx imagetools inspect "${IMAGE}:sha-${commit::7}" > /dev/null 2>&1; then
              continue
            fi
            while read -r path; do
              if [[ -n "${path}" ]] && in_image "${path}"; then
                echo "::error::${path} changed after ${commit::7}, the last commit with an image, so ${GITHUB_SHA::7} needs its own. Let main.yaml finish for it, then re-run this workflow. Nothing is rebuilt here."
                exit 1
              fi
            done <<< "$(git diff --name-only "${commit}" "${GITHUB_SHA}")"
            if [[ "${commit}" != "${GITHUB_SHA}" ]]; then
              echo "::notice::${GITHUB_SHA::7} changed nothing in the image since ${commit::7}: releasing that commit's image."
            fi
            echo "ref=${IMAGE}:sha-${commit::7}" >> "${GITHUB_OUTPUT}"
            exit 0
          done
          echo "::error::No image for ${GITHUB_SHA::7} or the 50 commits before it on main. Let main.yaml finish, then re-run this workflow."
          exit 1

      - name: Retag the image built by main.yaml
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          source_ref="${SOURCE_REF}"
          # Manifest-level copy: keeps both architectures, the provenance and the SBOM.
          docker buildx imagetools create \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${IMAGE}:latest" \
            "${source_ref}"
          mkdir -p dist
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{ json .Manifest }}' | jq -r .digest)"
          echo "${IMAGE}@${digest}" > dist/image-digest.txt
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --format '{{ json .SBOM }}' > dist/sbom.spdx.json

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package and push the chart
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm lint --strict "charts/${APP}"
          # Sets version and appVersion in the packaged chart; Chart.yaml in git stays 0.0.0.
          helm package "charts/${APP}" --version "${version}" --app-version "${GITHUB_REF_NAME}" --destination dist
          echo "${REGISTRY_PASSWORD}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "dist/${APP}-${version}.tgz" "${CHART_REPOSITORY}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            dist/*.tgz dist/image-digest.txt dist/sbom.spdx.json
