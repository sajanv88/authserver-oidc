packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole repo. Packages depend on "catalog:".
# turbo is pinned in the root package.json instead: the Dockerfile reads it from there.
catalog:
  "@biomejs/biome": 2.5.15
  "@nuvui/react": 0.10.0
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/api-logs": 0.223.0
  "@opentelemetry/exporter-metrics-otlp-proto": 0.223.0
  "@opentelemetry/instrumentation": 0.223.0
  "@opentelemetry/resources": 2.12.0
  "@opentelemetry/sdk-logs": 0.223.0
  "@opentelemetry/sdk-metrics": 2.12.0
  "@opentelemetry/sdk-trace-base": 2.12.0
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vercel/otel": 2.1.3
  next: 16.4.6
  postcss: 8.5.30
  react: 19.3.1
  react-dom: 19.3.1
  sass: 1.105.2
  server-only: 0.0.1
  stylelint: 17.16.0
  stylelint-config-standard-scss: 17.0.0
  typescript: 7.0.2
  valibot: 1.5.0
  "@electric-sql/pglite": 0.4.6
  "@types/pg": 8.23.1
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  esbuild: 0.28.2
  pg: 8.23.1
  vitest: 5.0.5
  # Auth server
  "@better-auth/oauth-provider": 1.7.27
  "@nuvui/backgrounds": 0.1.2
  "@nuvui/barcodes": 0.1.6
  "@nuvui/icons": 0.1.0
  "@nuvui/table": 0.1.10
  "@tanstack/react-table": 9.3.1
  better-auth: 1.7.27
  jose: 6.2.18
  nodemailer: 10.6.1
  react-email: 6.11.16
  "@react-email/ui": 6.11.16
  # End-to-end suite (apps/tests)
  "@playwright/test": 1.65.1
  playwright-bdd: 9.2.1
  # Landing page (apps/landing)
  "@nuvui/chat": 0.2.2
  shiki: 4.6.0
  # nextidp's checks of what it publishes, and the NestJS, Express, Fastify and Hono it's tested with (packages/nextidp)
  "@arethetypeswrong/cli": 0.18.5
  "@nestjs/common": 12.6.0
  "@nestjs/core": 12.6.0
  "@nestjs/platform-express": 12.6.0
  "@types/express": 5.0.6
  express: 5.3.0
  fastify: 5.12.8
  hono: 4.13.22
  # Cloudflare's workerd, for running nextidp's edge tests in a real Workers runtime
  miniflare: 4.20260730.0
  publint: 0.3.25
  reflect-metadata: 0.2.2
  rxjs: 7.8.2

# nextidp (packages/nextidp) is published to npm, so its own dependencies are ranges: an app
# that installs it then shares one copy of each with its other packages.
catalogs:
  nextidp:
    fast-http-client: ^0.2.0
    jose: ^6.2.18
    valibot: ^1.5.0

# Miniflare (nextidp's edge tests only) pins versions of these with known advisories; its
# latest stable release hasn't caught up. Patched versions, within the same majors.
overrides:
  "miniflare>undici": 7.30.2
  "miniflare>sharp": 0.35.5

# Install scripts are denied unless listed here (strictDepBuilds is on by default).
# Review a package's script before setting it to true.
allowBuilds:
  "@parcel/watcher": false
  # Its install script only checks the binary, or downloads one if the platform package is
  # missing; pnpm installs the platform package, so it isn't needed.
  workerd: false
  esbuild: true

# Supply chain: a version must be a day old before it can be installed, and a package
# whose new version lost the provenance its previous version had is refused.
minimumReleaseAge: 1440
trustPolicy: no-downgrade

audit:
  level: high

permissions:
  drizzle-kit:
    skills: false
  "@tanstack/react-table":
    skills: false
