# Production overrides. Pass after values.yaml: -f values.yaml -f values-production.yaml
# (in Argo CD: helm.valueFiles: [values.yaml, values-production.yaml]).

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    memory: 768Mi

imagePullSecrets:
  - name: ghcr-pull

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Broad per-IP limits at the edge; the app's own limiter covers sign-in, codes and tokens.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "20"
  hosts:
    - host: auth.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: auth-server-tls
      hosts:
        - auth.example.com

# The whole map replaces values.yaml's config: every key the app reads is listed.
# example.com stands for your production domain: replace it here and in the ingress above.
config:
  BETTER_AUTH_URL: https://auth.example.com
  COOKIE_DOMAIN: .example.com
  TRUSTED_ORIGINS: https://app.example.com
  # The ingress controller's pod network: narrow it to your cluster's pod CIDR.
  TRUSTED_PROXIES: 10.0.0.0/8
  EMAIL_PROVIDER: smtp
  EMAIL_FROM: "Auth <no-reply@example.com>"
  # The SMTP relay (e.g. Cloudflare's): set host and user before the first sync. The app
  # refuses to start while they're empty.
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  # Cloudflare Turnstile: the site key here and TURNSTILE_SECRET_KEY in the Secret. Empty
  # leaves it off.
  TURNSTILE_SITE_KEY: ""
  # Sign-in with another account. Each provider's client ID is here and its secret in the
  # Secret; a provider is on when both are set. Redirect URI to register with each provider:
  #   <BETTER_AUTH_URL>/api/auth/callback/<google | microsoft | github | sso>
  GOOGLE_CLIENT_ID: ""
  GITHUB_CLIENT_ID: ""
  MICROSOFT_CLIENT_ID: ""
  # common (work and personal accounts), organizations, consumers, or your tenant's ID.
  # A work account's email is trusted (linked to an existing account, no confirmation email)
  # only from that one tenant, or when the app registration adds the optional ID token claim
  # xms_edov: any organisation's admin can set any address on their own users.
  MICROSOFT_TENANT_ID: common
  # Any OpenID Connect provider (Okta, Keycloak, Auth0, Entra ID…): the button says
  # "Continue with <SSO_NAME>". All three here, and SSO_CLIENT_SECRET in the Secret, or none.
  SSO_NAME: ""
  SSO_DISCOVERY_URL: ""
  SSO_CLIENT_ID: ""
  # The APIs apps may get access tokens for (RFC 8707 resource indicators), comma separated,
  # https: a token asked for with resource=<one of them> is a JWT whose `aud` is that API.
  # Clients are linked to them by `pnpm clients:provision` (or not at all). An API's tokens
  # can last less than the server's, after a space: "https://api.example.com access=5m refresh=8h".
  OAUTH_RESOURCES: ""
  # Scopes for those APIs (crm, booking…), offered beside openid, profile, email and
  # offline_access, separated by commas or spaces.
  OAUTH_API_SCOPES: ""
  # How long tokens last, as a duration (90s, 15m, 8h, 30d). Access tokens (a service's too)
  # and ID tokens: 1 minute to 24 hours. Refresh tokens: 1 hour to 365 days, and longer than
  # access tokens.
  ACCESS_TOKEN_LIFETIME: "10m"
  ID_TOKEN_LIFETIME: "10m"
  REFRESH_TOKEN_LIFETIME: "30d"
  # "true": every admin must have two-factor authentication on. An admin without it is sent
  # to set it up first, before any other page or app. Admins can also require it of anyone
  # on the Users screens.
  TWO_FACTOR_REQUIRED_FOR_ADMINS: "false"
  # The product's name on every page, in titles, emails and authenticator apps (one line, up
  # to 50 characters). Empty for "Next-Identity Server".
  APP_NAME: ""
  # Your logo instead of the shield, on every page (32 px, 28 px in the top bar) and as the
  # browser tab's icon: a full https URL; a square image looks best. Empty, or an image that
  # fails to load, shows the shield. Its origin is allowed in the CSP.
  LOGO_URL: ""
  DATABASE_POOL_MAX: "10"
  OTEL_SERVICE_NAME: auth-server
  # Traces (every request, each sign-in, sign-up, reset and admin step, Better Auth's endpoints
  # and queries) and metrics (each step's outcome and duration, browsers' web vitals such as LCP)
  # go to an OTLP/HTTP endpoint, such as your collector. Unset: nothing is exported, and
  # browsers don't report web vitals.
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production

existingSecret: auth-server-secrets
