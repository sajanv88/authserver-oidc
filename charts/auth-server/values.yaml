# Defaults for auth-server. values-production.yaml overrides what differs in production.

replicaCount: 2

image:
  repository: ghcr.io/sajanv88/auth-server
  # Empty means the chart's appVersion, which release.yaml sets to the git tag. When Argo CD
  # syncs the chart straight from the repo (appVersion 0.0.0), set this to sha-<short-sha>.
  tag: ""
  pullPolicy: IfNotPresent

# GHCR packages are private by default. Create a docker-registry Secret with a token that
# has read:packages and name it here, e.g. [{ name: ghcr-pull }].
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Matches the image: uid/gid 1001, no root, no privilege escalation, read-only root filesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

containerPort: 3000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"   # streaming responses
    # nginx.ingress.kubernetes.io/limit-rps: "20"
  # The auth server's host: BETTER_AUTH_URL below must be https://<this host>.
  hosts:
    - host: auth.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: auth-server-tls
  #    hosts: [auth.example.com]

# No CPU limit: throttling a Node server under a burst hurts latency more than sharing a core.
# The memory limit stays, because Node grows its heap to what it's given.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Startup and liveness hit /api/health, which never touches a dependency, so a database outage
# never restarts pods. Readiness hits /api/ready, which answers 503 while the database doesn't
# (a `select 1`, 2 seconds at most), so a pod that can't reach it gets no traffic.
probes:
  startup:
    httpGet: { path: /api/health, port: http }
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    httpGet: { path: /api/health, port: http }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet: { path: /api/ready, port: http }
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Non-secret runtime configuration, rendered into a ConfigMap and loaded with envFrom.
# A change rolls the pods (checksum annotation on the Deployment). The app validates all of it
# at startup (src/shared/config/env-schema.ts) and refuses to start on anything wrong; in
# production (the image sets NODE_ENV=production) URLs must be https and email must be smtp.
config:
  # The public URL of the auth server, also the OIDC issuer. A bare https origin.
  BETTER_AUTH_URL: https://auth.example.com
  # Parent domain for the shared session cookie; empty turns cross-subdomain cookies off.
  COOKIE_DOMAIN: .example.com
  # Every app origin allowed to call the auth server, comma-separated, https, no wildcards.
  TRUSTED_ORIGINS: https://app.example.com
  # The ingress controller's pod addresses (IPs or CIDRs, comma-separated). The client IP for
  # rate limiting is the rightmost X-Forwarded-For hop that isn't one of these. Empty trusts
  # no proxy, so every request looks like it comes from the ingress: set it.
  TRUSTED_PROXIES: ""
  EMAIL_PROVIDER: smtp
  EMAIL_FROM: "Auth <no-reply@example.com>"
  # Port 465 = implicit TLS, 587 = STARTTLS (required).
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USER: ""
  # Cloudflare Turnstile's site key (public). Set it, with TURNSTILE_SECRET_KEY in the Secret,
  # to put Turnstile on the forms and the auth endpoints behind them. Empty turns it off.
  TURNSTILE_SITE_KEY: ""
  # Sign-in with another account. Each provider's client ID is here and its secret in the
  # Secret; a provider is on when both are set. Redirect URI to register with each provider:
  #   <BETTER_AUTH_URL>/api/auth/callback/<google | microsoft | github | sso>
  GOOGLE_CLIENT_ID: ""
  GITHUB_CLIENT_ID: ""
  MICROSOFT_CLIENT_ID: ""
  # common (work and personal accounts), organizations, consumers, or your tenant's ID.
  # A work account's email is trusted (linked to an existing account, no confirmation email)
  # only from that one tenant, or when the app registration adds the optional ID token claim
  # xms_edov: any organisation's admin can set any address on their own users.
  MICROSOFT_TENANT_ID: common
  # Any OpenID Connect provider (Okta, Keycloak, Auth0, Entra ID…): the button says
  # "Continue with <SSO_NAME>". All three here, and SSO_CLIENT_SECRET in the Secret, or none.
  SSO_NAME: ""
  SSO_DISCOVERY_URL: ""
  SSO_CLIENT_ID: ""
  # The APIs apps may get access tokens for (RFC 8707 resource indicators), comma separated,
  # https: a token asked for with resource=<one of them> is a JWT whose `aud` is that API.
  # Clients are linked to them by `pnpm clients:provision` (or not at all). An API's tokens
  # can last less than the server's, after a space: "https://api.example.com access=5m refresh=8h".
  OAUTH_RESOURCES: ""
  # Scopes for those APIs (crm, booking…), offered beside openid, profile, email and
  # offline_access, separated by commas or spaces.
  OAUTH_API_SCOPES: ""
  # How long tokens last, as a duration (90s, 15m, 8h, 30d). Access tokens (a service's too)
  # and ID tokens: 1 minute to 24 hours. Refresh tokens: 1 hour to 365 days, and longer than
  # access tokens.
  ACCESS_TOKEN_LIFETIME: "10m"
  ID_TOKEN_LIFETIME: "10m"
  REFRESH_TOKEN_LIFETIME: "30d"
  # "true": every admin must have two-factor authentication on. An admin without it is sent
  # to set it up first, before any other page or app. Admins can also require it of anyone
  # on the Users screens.
  TWO_FACTOR_REQUIRED_FOR_ADMINS: "false"
  # The product's name on every page, in titles, emails and authenticator apps (one line, up
  # to 50 characters). Empty for "Next-Identity Server".
  APP_NAME: ""
  # Your logo instead of the shield, on every page (32 px, 28 px in the top bar) and as the
  # browser tab's icon: a full https URL; a square image looks best. Empty, or an image that
  # fails to load, shows the shield. Its origin is allowed in the CSP.
  # Emails show it too, unless it's an SVG (Gmail and Outlook don't).
  LOGO_URL: ""
  # Connections per pod; replicas × this must stay under the database's limit.
  DATABASE_POOL_MAX: "10"
  OTEL_SERVICE_NAME: auth-server
  # Traces (every request, each sign-in, sign-up, reset and admin step, Better Auth's endpoints
  # and queries) and metrics (each step's outcome and duration, browsers' web vitals such as LCP)
  # go to an OTLP/HTTP endpoint, such as your collector. Unset: nothing is exported, and
  # browsers don't report web vitals.
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318

# Name of a Secret that already exists in the namespace (External Secrets, Sealed Secrets,
# or created by hand), loaded with envFrom. The chart only references it and never creates it:
# secret values never go in values files. It must hold:
#   BETTER_AUTH_SECRET  at least 32 random characters (openssl rand -base64 32)
#   DATABASE_URL        postgres://… (TLS settings in the URL: sslmode=verify-full&…)
#   SMTP_PASSWORD       the SMTP password or API token
# and, only with config.TURNSTILE_SITE_KEY set:
#   TURNSTILE_SECRET_KEY  Cloudflare Turnstile's secret key
# and, for each sign-in provider whose client ID is set in config:
#   GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_SECRET, MICROSOFT_CLIENT_SECRET, SSO_CLIENT_SECRET
existingSecret: auth-server-secrets

# Extra env entries, in the Kubernetes EnvVar shape.
env: []

# .next/cache must be writable with a read-only root filesystem.
nextCache:
  sizeLimit: 512Mi

# Covers in-flight requests and after() callbacks on SIGTERM.
terminationGracePeriodSeconds: 30

revisionHistoryLimit: 3

# Spread replicas across zones and nodes when the cluster can; never block scheduling on it.
topologySpread:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}

# Added by nuvraxis-fullstack.
db:
  # Merged into values.yaml under `db:` by the fullstack scaffold. Frontend values are untouched.

  # The existing Secret with the DATABASE_URL key. Empty means existingSecret above (one Secret
  # for everything). The migrate Job reads only that key from it. It must exist before the first
  # sync, or the migrate pod stays in CreateContainerConfigError and the sync never starts.
  externalSecret:
    name: ""

  migrate:
    # Run committed migrations as an Argo CD PreSync Job on every sync.
    enabled: true
    # The bundled runner in the app image (apps/auth-server/Dockerfile). It exits non-zero on failure,
    # which fails the sync before the new Deployment is applied.
    command: ["node", "packages/db/dist/migrate.mjs"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
